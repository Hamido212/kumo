# Tests every push, builds the exe, and attaches it to a GitHub release for tags like v0.2.0.
# A fully automated build from the public repository is also what SignPath asks for before it
# signs open source releases for free.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# The build runs third-party code (cargo, build scripts), so it only gets a read-only token.
# Only the release job below can write, and only for tags.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Third-party notices are current
        run: python tools/third_party.py --check
      - name: Test
        run: cargo test --profile fast
      - name: Build
        run: cargo build --release
      - name: Name the download
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          Copy-Item target/release/kumo.exe "Kumo-Setup-$version.exe"
      - name: Checksum
        shell: pwsh
        run: |
          $exe = (Get-ChildItem Kumo-Setup-*.exe).Name
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          # "hash *file" is the format `sha256sum -c` reads; the file is ASCII with a Unix line end
          [IO.File]::WriteAllText("$exe.sha256", "$hash *$exe`n", [Text.Encoding]::ASCII)
          Write-Host "$hash  $exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kumo
          path: |
            Kumo-Setup-*.exe
            Kumo-Setup-*.exe.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write       # creates the release
      id-token: write       # signs the build provenance
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kumo
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: Kumo-Setup-*.exe
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            Kumo-Setup-*.exe
            Kumo-Setup-*.exe.sha256
