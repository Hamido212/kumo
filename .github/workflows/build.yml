# Tests every push, builds the exe, and attaches it to a GitHub release for tags like v0.2.0.
# A fully automated build from the public repository is also what SignPath asks for before it
# signs open source releases for free.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write
  id-token: write       # signs the build provenance
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Third-party notices are current
        run: python tools/third_party.py --check
      - name: Test
        run: cargo test --profile fast
      - name: Build
        run: cargo build --release
      - name: Name the download
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          Copy-Item target/release/kumo.exe "Kumo-Setup-$version.exe"
      - name: Checksum
        shell: pwsh
        run: |
          $exe = (Get-ChildItem Kumo-Setup-*.exe).Name
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          # "hash *file" is the format `sha256sum -c` reads; the file is ASCII with a Unix line end
          [IO.File]::WriteAllText("$exe.sha256", "$hash *$exe`n", [Text.Encoding]::ASCII)
          Write-Host "$hash  $exe"
      - uses: actions/upload-artifact@v4
        with:
          name: kumo
          path: |
            Kumo-Setup-*.exe
            Kumo-Setup-*.exe.sha256
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: Kumo-Setup-*.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Kumo-Setup-*.exe
            Kumo-Setup-*.exe.sha256
